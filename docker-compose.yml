services:
  xray:
    image: teddysun/xray:latest
    container_name: agent_xray_proxy
    restart: unless-stopped
    volumes:
      - ./xray_config.json:/etc/xray/config.json

  aider-agent:
    build: .
    container_name: aider_agent
    restart: unless-stopped
    depends_on:
      - xray
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SSH_KEYS=${SSH_KEYS}
    volumes:
      # Изолированный волюм докера для всех репозиториев (внутри он будет полностью под root)
      - projects_data:/app/workspace
      # Папка с кодом самого бота-агента (оставляем хост-маунт, чтобы ты мог править код бота на хосте)
      - ./:/app/agent
      # Проброс ключей и гитконфига
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /app/workspace
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: python3 /app/agent/src/bot.py

# Объявляем именованный волюм. Теперь данные репозиториев не сотрутся при перезапусках
volumes:
  projects_data: