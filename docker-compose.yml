services:
  xray:
    image: teddysun/xray:latest
    container_name: agent_xray_proxy
    restart: unless-stopped
    volumes:
      - ./xray_config.json:/etc/xray/config.json

  aider-agent:
    build: .
    container_name: aider_agent
    restart: unless-stopped
    depends_on:
      - xray
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SSH_KEYS=${SSH_KEYS}
      # Переменную GIT_SSH_COMMAND здесь НЕ задаем глобально, 
      # так как наш скрипт entrypoint.sh настроит всё локально для каждого репозитория
    volumes:
      # Папка со всеми твоими репозиториями
      - /home/rovno-dev/repos:/app/workspace
      # Папка с кодом самого бота-агента
      - ./:/app/agent
      # Проброс ключей (скрипт заберет их отсюда, скопирует и настроит права под root внутри контейнера)
      - ~/.ssh:/root/.ssh:ro
      # Проброс глобального гитконфига (опционально, но полезно для name/email)
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /app/workspace
    # Точка входа, которая выполнит всю грязную работу с правами и SSH перед запуском бота
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: python3 /app/agent/src/bot.py