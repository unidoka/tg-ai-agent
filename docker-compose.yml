services:
  xray:
    image: teddysun/xray:latest
    container_name: agent_xray_proxy
    restart: unless-stopped
    volumes:
      # Мапим локальный конфиг юзера внутрь контейнера
      - ./xray_config.json:/etc/xray/config.json

  aider-agent:
    build: .
    container_name: aider_agent
    restart: unless-stopped
    depends_on:
      - xray
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /home/rovno-dev/repos:/app/workspace # Это юзер поменяет под себя
      - ./:/app/agent
    working_dir: /app/workspace
    command: python3 /app/agent/src/bot.py